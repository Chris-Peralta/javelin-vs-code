name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

  bump-version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version "${{ inputs.bump }}" -m "chore: release v%s"
            git push --follow-tags
            version="$(node -p "require('./package.json').version")"
            echo "ref=v$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            base="$(node -p "require('./package.json').version")"
            version="${base}-beta.${{ github.run_number }}"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: bump-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Set beta version
        if: needs.bump-version.outputs.prerelease == 'true'
        run: npm version "${{ needs.bump-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Prune node-hid prebuilds for target
        run: node scripts/prune-prebuilds.js ${{ matrix.target }}

      - name: Package extension
        run: npx vsce package --target ${{ matrix.target }} -o javelin-paper-tape-${{ needs.bump-version.outputs.version }}-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ needs.bump-version.outputs.prerelease }}" = "true" ]; then
            # tag doesn't exist yet for beta builds, so point it at the commit that was built
            args+=(--prerelease --target "${{ needs.bump-version.outputs.ref }}")
          fi
          gh release create "v${{ needs.bump-version.outputs.version }}" \
            dist/*.vsix \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.bump-version.outputs.version }}" \
            --generate-notes \
            "${args[@]}"
